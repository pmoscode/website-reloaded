name: Release pmoscode website

# main          → Staging (GitHub Pages)
# Tag vX.Y.Z    → Produktion (rsync auf pmoscode.dev)
on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # renovate: datasource=github-releases depName=gohugoio/hugo
  HUGO_VERSION: "0.168.0"
  # renovate: datasource=github-releases depName=Pagefind/pagefind
  PAGEFIND_VERSION: "1.6.0"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STAGE: ${{ github.ref_type == 'tag' && 'production' || 'staging' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup tools
        uses: ./.github/actions/setup-tools
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          pagefind-version: ${{ env.PAGEFIND_VERSION }}

      - name: Build (${{ env.STAGE }})
        run: hugo --gc --minify --environment "$STAGE"

      - name: Build search index
        run: pagefind --site public

      - name: Upload artifact (production)
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: page
          path: ./public

      - name: Upload artifact (GitHub Pages)
        if: github.ref_type == 'branch'
        uses: actions/upload-pages-artifact@v5
        with:
          name: page
          path: ./public

  deploy-staging:
    if: github.ref_type == 'branch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: page

  deploy-production:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://pmoscode.dev
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: page
          path: ./public

      - name: Prepare SSH
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$REMOTE_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Rsync to remote
        env:
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          rsync -avz --delete --human-readable --itemize-changes \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./public/ "${REMOTE_USER}@${REMOTE_HOST}:${REMOTE_PATH}"
