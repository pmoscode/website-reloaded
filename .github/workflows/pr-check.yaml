name: PR check

on:
  pull_request:

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=gohugoio/hugo
  HUGO_VERSION: "0.168.0"
  # renovate: datasource=github-releases depName=Pagefind/pagefind
  PAGEFIND_VERSION: "1.6.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup tools
        uses: ./.github/actions/setup-tools
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          pagefind-version: ${{ env.PAGEFIND_VERSION }}

      - name: Build (staging, strict)
        run: hugo --gc --minify --environment staging --panicOnWarning --printPathWarnings

      - name: Build search index
        run: pagefind --site public
